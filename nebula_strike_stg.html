const keys={};
addEventListener('keydown',e=>{
 if(mobile.enabled&&currentPage()!=='play'&&['Enter','Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))return;
 const inGame=mode==='play'&&!paused;
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter','Escape'].includes(e.code))e.preventDefault();
 if(e.code==='KeyM'){if(!e.repeat)toggleMute();return}
 if(e.code==='Escape'||e.code==='KeyP'){
  if(e.repeat)return;
  if(mode==='play'&&(!paused||pausePage==='pause'))togglePause();
  else menuBack();
  return;
 }
 if(inGame)keys[e.code]=1;else if(!e.repeat)handleMenuKey(e.code);
});
addEventListener('keyup',e=>keys[e.code]=0);
addEventListener('blur',()=>{clearInput();if(mode==='play'&&!paused)togglePause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInput();if(mode==='play'&&!paused)togglePause()}});

function hazardBase(h){

  const host=terrainBlocks.find(b=>h.x>=b.wx-world&&h.x<=b.wx-world+b.w&&Math.abs((h.top?b.y+b.h:b.y)-h.baseY)<1);
  if(host){const r=blockRect(host);return h.top?r.y+r.h:r.y}

}
function hazardLength(h){

 const base=hazardBase(h);let edge=h.top?floorY(h.x):ceiling(h.x);
 for(const b of terrainBlocks){
  const bounds=terrainBoundsAt(b,h.x,h.w*.5),r={x:b.wx-world,y:bounds.top,w:b.w,h:bounds.bottom-bounds.top};if(h.x+h.w*.5<r.x||h.x-h.w*.5>r.x+r.w)continue;

 mobileEl('mobile-pause').addEventListener('click',()=>{togglePause();draw()});
 mobileEl('mobile-sound').addEventListener('click',()=>{resumeAudio();toggleMute();syncMobileUI()});
 mobileEl('mobile-fullscreen').addEventListener('click',mobileFullscreen);
 mobileEl('mobile-menu').addEventListener('click',e=>{
  const button=e.target.closest?.('[data-mobile-action]');if(!button||button.disabled)return;
  const id=button.dataset.mobileAction;if(id==='auto')toggleAutoFire();
  else if(id==='sound'){if(!paused)resumeAudio();toggleMute()}
  else if(id==='fullscreen')mobileFullscreen();
  else if(id==='tab-equipment'||id==='tab-presets'){mobile.buildTab=id.slice(4);mobile.menuKey='';mobileEl('mobile-content').scrollTop=0}
  else{const item=menuItems.find(b=>b.id===id);if(!item||item.disabled)return;if(button.dataset.reverse==='true')item.reverse?.();else item.action()}
  draw();
 });
 for(const el of [canvas,stick,mobileEl('touch-actions')])el.addEventListener('contextmenu',e=>e.preventDefault());
 addEventListener('resize',resizeMobile);window.visualViewport?.addEventListener('resize',resizeMobile);
 window.matchMedia?.('(pointer:coarse)').addEventListener?.('change',resizeMobile);
 addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&!mobile.enabled){mobile.touchSeen=true;resizeMobile();draw()}});
 document.addEventListener('fullscreenchange',resizeMobile);
 resizeMobile();
}
function mobileCard(item,extra='',sub=''){
 const className='m-card '+extra+(item.selected?' selected':'');
 return '<button id="m-'+htmlText(item.id)+'" class="'+className+'" data-mobile-action="'+htmlText(item.id)+'"'+(item.disabled?' disabled':'')+(item.selected?' aria-pressed="true"':'')+'><span>'+htmlText(item.label)+'</span>'+((sub||item.sub)?'<small>'+htmlText(sub||item.sub)+'</small>':'')+(item.tag?'<span class="m-tag">'+htmlText(item.tag)+'</span>':'')+'</button>';
}
function mobileStatsHTML(stats){return '<div class="m-stats">'+stats.map(s=>'<div class="m-stat"><small>'+htmlText(s.label)+'</small><strong>'+htmlText(s.value)+'</strong></div>').join('')+'</div>'}
function mobileMenuHTML(page){
 const items=menuItems,byId=id=>items.find(m=>m.id===id),cards=list=>'<div class="m-grid">'+list.map(item=>mobileCard(item,['start','resume'].includes(item.id)?'primary':'')).join('')+'</div>';
 let body='',footer=[];
 if(page==='menu'){
  const title=TITLES.find(t=>t.id===profile.equipped)?.name||'ROOKIE PILOT';
  body='<div class="m-info"><strong>'+htmlText(title)+'</strong><p>左スティックで移動・自動連射でショット。<br>横向きなら画面の左右に操作ボタンを配置。</p></div>'+cards(items)+mobileStatsHTML([{label:'BEST 1 → 4',value:formatTime(profile.best.full)}])+'<div class="m-info"><strong>出撃装備</strong><p>'+htmlText(buildSummary(build))+'</p><p>初期シールド '+build.shield+' / '+htmlText(MODULE[build.module].name)+'</p></div>';
 }else if(page==='build'){
  body='<div class="m-budget"><strong>'+buildCost()+' / '+BUILD_BUDGET+' PT 使用</strong><span>残り '+(BUILD_BUDGET-buildCost())+' PT</span></div><div class="m-tabs" role="group" aria-label="ビルドの表示切替"><button data-mobile-action="tab-equipment" class="'+(mobile.buildTab==='equipment'?'active':'')+'" aria-pressed="'+(mobile.buildTab==='equipment')+'">装備を調整</button><button data-mobile-action="tab-presets" class="'+(mobile.buildTab==='presets'?'active':'')+'" aria-pressed="'+(mobile.buildTab==='presets')+'">プリセット 12</button></div>';
  if(mobile.buildTab==='presets')body+='<div class="m-presets">'+items.filter(i=>i.id.startsWith('preset')).map(i=>mobileCard(i)).join('')+'</div>';
  else{
   const labels={speed:'移動速度',multi:'マルチ系',laser:'レーザー系',startWeapon:'初期ショット',missile:'副武器',option:'オプション',formation:'配置',shield:'シールド',module:'モジュール'};
   body+=BUILD_FIELDS.map(f=>{const item=byId('field'+f.key),value=build[f.key],text=f.items?f.items[value].name:String(value);return '<div class="m-build-row"><div class="m-build-label"><span>'+labels[f.key]+' / '+htmlText(item.tag)+'</span><strong>'+htmlText(text)+'</strong><small>'+htmlText(item.sub)+'</small></div><button id="m-field'+f.key+'-minus" class="m-step" data-mobile-action="field'+f.key+'" data-reverse="true" aria-label="'+labels[f.key]+'を前の設定へ">−</button><button id="m-field'+f.key+'-plus" class="m-step" data-mobile-action="field'+f.key+'" aria-label="'+labels[f.key]+'を次の設定へ">＋</button></div>'}).join('');
   body+='<p>マルチ系・レーザー系はカプセルで強化する武器。初期ショットで出撃時の装備を選びます。</p>';
  }
  footer=[byId('done')];
 }else if(page==='stageSelect'){
  body='<div class="m-grid">'+STAGES.map((s,i)=>mobileCard({...byId('sector'+i),label:'0'+(i+1)+' / '+s.short,sub:s.sub+' · BEST '+formatTime(profile.best.stages[i])})).join('')+'</div><p>1面から始めると通しクリア・0デス称号に挑戦できます。</p>';footer=[byId('back')];
 }else if(page==='pause'){
  body=mobileStatsHTML([{label:'STAGE '+(run.startStage+1)+' → '+(stage+1),value:formatTime(totalTime)},{label:'DEATHS / 1UP',value:run.deaths+' / '+run.extends}])+cards(items.filter(i=>i.id!=='sound'))+'<p>'+htmlText(buildSummary(run.build))+'</p>';
 }else if(page==='records'){
  body=mobileStatsHTML(menuStats)+mobileStatsHTML(STAGES.map((s,i)=>({label:'STAGE '+(i+1)+' BEST',value:formatTime(profile.best.stages[i])})))+'<h2>開始面 → 最終面のベスト</h2>'+mobileStatsHTML(STAGES.map((s,i)=>({label:(i+1)+' → 4',value:formatTime(profile.best.routes[i])})))+'<h2>称号を選んで装備</h2>'+cards(items.filter(i=>i.id!=='back'));footer=[byId('back')];
 }else if(page==='how'){
  const rows=[['移動','左スティックに触れて滑らせると、上下左右・斜めに移動。指を離すと停止します。PCでは矢印 / WASD。'],['ショット','AUTO ON で自動連射。AUTO OFF にすると SHOT を押している間だけ射撃。移動と同時に操作できます。'],['パワーアップ','カプセルで光っている枠を進め、右の POWER で強化。上限の枠は文字が消え、押しても消費しません。'],['画面・中断','横向きは画面の左右、縦向きは画面の下に操作部を配置。向きを変えたときやアプリを離れたときは自動中断。「再開」で続けられます。'],['マップ','上下にカメラが追従。宇宙面は上下ループ。高速面の扉には迂回路があります。'],['ボス・復帰','光るコアが弱点。残機があればボス HP を引き継いで復帰。補給 MOB のカプセルで再強化できます。'],['1UP','20,000 点で最初の 1UP、以降 50,000 点ごと。各ボス撃破でも 1UP。全滅すると終了。'],['称号・記録','通し称号は1面から全4ボスを撃破。0デス称号はシールド被弾可。記録は端末・ブラウザごとに保存されます。']];
  body='<dl class="m-manual">'+rows.map(([label,text])=>'<dt>'+label+'</dt><dd>'+text+'</dd>').join('')+'</dl>';footer=[byId('back')];
 }else if(page==='confirm'){
  body='<div class="m-info"><strong>'+htmlText(confirmText)+'</strong><p>現在のプレイ途中の状態には戻せません。</p></div>';footer=[byId('cancel'),byId('confirm')];
 }else if(page==='over'||page==='clear'){
  body=mobileStatsHTML(menuStats)+'<h2>このランで獲得した称号</h2><div class="m-info">'+((run?.newTitles||[]).map(id=>'<p>◆ '+htmlText(TITLES.find(t=>t.id===id)?.name)+'</p>').join('')||'<p>新しい称号はありません。</p>')+'</div>'+cards(items);
 }
 if(['menu','pause','how'].includes(page))body+='<h2>タッチ操作</h2><div class="m-grid"><button class="m-card" data-mobile-action="auto" aria-pressed="'+mobile.autoFire+'">自動連射：'+(mobile.autoFire?'ON':'OFF')+'<small>OFF のときは SHOT を長押し</small></button></div>';
 body+='<p>'+(!storageOK?'この環境では記録を保存できません。':page==='menu'?'記録・ビルドはこのブラウザに自動保存。':'')+'</p>';
 const footerHTML=footer.filter(Boolean).map(i=>'<button id="m-'+i.id+'" data-mobile-action="'+i.id+'">'+htmlText(i.label)+'</button>').join('')+(page==='confirm'?'':'<button class="m-utility" data-mobile-action="sound" aria-label="サウンド切替">音 '+(muted?'OFF':'ON')+'</button>'+(canFullscreen()?'<button class="m-utility" data-mobile-action="fullscreen">全画面</button>':''));
 return{body,footer:footerHTML};
}
function syncMobileUI(){
 if(!mobile.enabled||!mobileEl('mobile-menu'))return;
 const page=currentPage(),playing=page==='play';
 mobileEl('mobile-menu').hidden=playing;
 for(const id of ['mobile-hud','mobile-gauge','touch'])mobileEl(id).hidden=!playing;
 mobileEl('mobile-hint').hidden=!playing||!mobile.layout?.showHint;
 canvas.setAttribute('aria-hidden',playing?'false':'true');
 const notification=mobileEl('mobile-notice');notification.classList.toggle('visible',noticeTime>0);if(noticeTime>0&&notification.textContent!==notice)notification.textContent=notice;
 const text=(id,value)=>{const el=mobileEl(id);if(el.textContent!==value)el.textContent=value};
 if(playing){
  text('mobile-score',String(score|0).padStart(8,'0'));text('mobile-life','残機 '+Math.max(0,player.lives+1)+' / 防御 '+player.shield);
  text('mobile-stage','STAGE '+(stage+1));text('mobile-time',Math.floor(totalTime/60)+':'+String(Math.floor(totalTime%60)).padStart(2,'0'));
  text('mobile-sound','音 '+(muted?'OFF':'ON'));mobileEl('mobile-fullscreen').hidden=!canFullscreen();
  text('touch-auto','AUTO '+(mobile.autoFire?'ON':'OFF'));mobileEl('touch-auto').setAttribute('aria-pressed',String(mobile.autoFire));
  const labels=POWER.map((_,i)=>powerLabel(i)),key=power+'|'+labels.join('|');
  if(key!==mobile.hudKey){mobile.hudKey=key;mobileEl('mobile-gauge').innerHTML=labels.map((label,i)=>'<span class="mobile-slot'+(i===power?' selected':'')+'"'+(i===power?' aria-current="true"':'')+'>'+htmlText(label)+'</span>').join('');text('touch-power-name',power>=0?labels[power]:'');mobileEl('touch-power').classList.toggle('unavailable',power<0||!powerAvailable(power))}
  mobile.menuPage=page;return;
 }
 const key=JSON.stringify([page,mobile.buildTab,menuHeading,menuItems.map(i=>[i.id,i.label,i.sub,i.tag,i.disabled,i.selected]),menuStats,build,selectedStage,profile.best,profile.equipped,profile.titles,muted,mobile.autoFire,confirmText,storageOK,canFullscreen()]);
 if(key===mobile.menuKey)return;
 mobile.menuKey=key;const content=mobileEl('mobile-content'),samePage=mobile.menuPage===page,scroll=samePage?content.scrollTop:0,focus=samePage?document.activeElement?.id:null;
 mobile.menuPage=page;
 const titles={menu:'NEBULA STRIKE',stageSelect:'ステージ選択',build:'ビルド格納庫',pause:'ミッション中断',records:'称号・ベストタイム',how:'操作ガイド',confirm:'確認',over:'MISSION FAILED',clear:'MISSION COMPLETE'};
 text('mobile-title',titles[page]||menuHeading.title);
  text('mobile-subtitle',page==='build'?'使用 '+buildCost()+' / '+BUILD_BUDGET+' PT · 残り '+(BUILD_BUDGET-buildCost())+' PT　マルチとレーザーは別々に選択。':page==='menu'?'4つの戦域を、自分だけのビルドで。':page==='pause'?'ゲーム・ボス・クリアタイムは停止中。':page==='confirm'?'内容を確認して選んでください。':page==='how'?'スティックとボタンで操作できます。':menuHeading.sub);
 const view=mobileMenuHTML(page);content.innerHTML=view.body;mobileEl('mobile-footer').innerHTML=view.footer;content.scrollTop=scroll;
 if(focus)document.getElementById?.(focus)?.focus({preventScroll:true});
 else if(!samePage){if(page==='confirm')document.getElementById?.('m-cancel')?.focus({preventScroll:true});else mobileEl('mobile-menu').focus({preventScroll:true})}
}
function loop(now){if(mobile.enabled&&now-last<1000/60-.6){requestAnimationFrame(loop);return}const dt=clamp((now-last)/1000||0,0,.05);last=now;update(dt);draw();requestAnimationFrame(loop)}
initMobile();
initField();draw();requestAnimationFrame(loop);
})();
</script>
